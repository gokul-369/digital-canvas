<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" loading="lazy" type="image/svg+xml" href="/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="Digital Canvas – Gokul" />
    <meta property="og:description" content="Minimal, fast, highly engineered portfolio." />
    <meta property="og:image" content="https://gokul.ink/preview.png" />
    <meta property="og:url" content="https://gokul.ink" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Digital Canvas – Gokul" />
    <meta name="twitter:description" content="Minimal, fast, highly engineered portfolio." />
    <meta name="twitter:image" content="https://gokul.ink/preview.png" />

    <title>Gokul's Digital Canvas</title>
    <style>
      html {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: #030407;
        color: #f8fafc;
        transition: background-color 0.3s ease;
      }
      html:not(.dark) {
        background-color: #f8fafc;
        color: #0f172a;
      }
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: transparent !important;
      }
    </style>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#f8fafc';
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#030407';
          }
        } catch(e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Caveat:wght@400..700&family=JetBrains+Mono:wght@300;400;500;600;700&family=Sacramento&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
